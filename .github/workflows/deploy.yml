name: Deploy auf GitHub Pages

# Voraussetzung: Im Repository muss GitHub Pages einmal aktiviert sein
# (Settings -> Pages -> Build and deployment -> Source: "GitHub Actions").
# Der GITHUB_TOKEN darf die Pages-Site nicht selbst anlegen; deshalb ist dieser
# eine Klick eine einmalige manuelle Einrichtung.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur lesender Zugriff auf den Code, Schreibzugriff für das Pages-Deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig; laufende werden abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Produktionsbuild erstellen
        run: npm run build

      # Verhindert, dass GitHub Pages die Dateien durch Jekyll verarbeitet.
      - name: .nojekyll anlegen
        run: touch dist/.nojekyll

      - name: Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Build als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deployment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
